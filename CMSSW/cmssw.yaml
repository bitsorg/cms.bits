build_requires:
 - SCRAMV1
 - dwz
 - cmssw-tool-conf
# Temporarily bypass dependency checking for CMSSW; keep module generation.
hook:
  POST_INSTALL: generate_module
sources:
 - git+https://github.com/cms-sw/cmssw-config.git?obj=master/%(configtag)s&export=config&output=/cmssw-config-%(configtag)s.tgz
 - git+https://github.com/cms-sw/cmssw.git?protocol=https&obj=master/fb7e0ddfaf202a080b18291928f4baee3d01054b&module=CMSSW&export=%(srctree)s&output=/src.tar.gz
force_revision: ""
